<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toc-Toc</title>
    <!-- Collegamento al Manifest per PWABuilder e Android -->
    <link rel="manifest" href="./manifest.json">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.4s ease;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            text-align: center;
            margin-top: 15px;
        }

        h1 {
            font-size: 22px;
            margin: 0;
            letter-spacing: 1px;
        }

        .stats {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .sound-selector {
            display: flex;
            gap: 8px;
            margin: 10px 0;
        }

        .sound-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sound-btn.active {
            background: #ff4757;
            border-color: #ff4757;
            font-weight: bold;
        }

        .tap-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .tap-button {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            border: none;
            box-shadow: 0 10px 30px rgba(255, 71, 87, 0.4);
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, box-shadow 0.1s;
            outline: none;
        }

        .tap-button:active {
            transform: scale(0.92);
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3);
        }

        .footer {
            margin-bottom: 20px;
            text-align: center;
            width: 100%;
        }

        .whatsapp-btn {
            background: #25D366;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        /* Effetto lampeggiante alla ricezione del segnale */
        @keyframes flash {
            0% { background-color: var(--bg-color); }
            50% { background-color: #ff4757; }
            100% { background-color: var(--bg-color); }
        }

        .alert-flash {
            animation: flash 0.5s ease 2;
        }
    </style>
</head>
<body>

    <header>
        <h1>TOC-TOC 💗</h1>
        <div class="stats" id="statsText">Totali: 0 | Oggi: 0 | Settimana: 0</div>
        
        <div class="sound-selector">
            <button class="sound-btn active" onclick="setSound('porta')">🚪 Porta</button>
            <button class="sound-btn" onclick="setSound('cuore')">💓 Cuore</button>
            <button class="sound-btn" onclick="setSound('magia')">✨ Magia</button>
        </div>
    </header>

    <div class="tap-container">
        <button class="tap-button" onclick="sendTap()">
            <span>TOC-TOC</span>
        </button>
    </div>

    <div class="footer">
        <a id="whatsappShare" class="whatsapp-btn" href="#" target="_blank">Invita su WhatsApp</a>
    </div>

    <script>
        // Configurazione Firebase
        const firebaseConfig = {
            databaseURL: "https://toctoc-302c3-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentSound = 'porta';
        let totalTaps = parseInt(localStorage.getItem('toctoc_total')) || 0;
        let todayTaps = parseInt(localStorage.getItem('toctoc_today')) || 0;
        let weekTaps = parseInt(localStorage.getItem('toctoc_week')) || 0;

        updateStatsDisplay();

        function setSound(soundType) {
            currentSound = soundType;
            document.querySelectorAll('.sound-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // Generatore Audio Web Audio API nativo
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (type === 'porta') {
                // Doppio colpo di porta raffinato
                playTone(220, 0.08, 'triangle');
                setTimeout(() => playTone(260, 0.12, 'triangle'), 120);
            } else if (type === 'cuore') {
                // Battito cardiaco tonfo-tonfo
                playTone(120, 0.1, 'sine');
                setTimeout(() => playTone(100, 0.15, 'sine'), 180);
            } else if (type === 'magia') {
                // Effetto magico ascendente
                playTone(400, 0.08, 'sine');
                setTimeout(() => playTone(600, 0.08, 'sine'), 80);
                setTimeout(() => playTone(880, 0.15, 'sine'), 160);
            }

            // Vibrazione aptica se supportata
            if (navigator.vibrate) {
                navigator.vibrate(70);
            }
        }

        function playTone(freq, duration, type) {
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log("Audio non avviato interattivamente");
            }
        }

        function sendTap() {
            playSound(currentSound);
            incrementStats();

            // Invia il segnale al database Firebase
            db.ref('signal').set({
                sound: currentSound,
                timestamp: Date.now()
            });
        }

        function incrementStats() {
            totalTaps++;
            todayTaps++;
            weekTaps++;

            localStorage.setItem('toctoc_total', totalTaps);
            localStorage.setItem('toctoc_today', todayTaps);
            localStorage.setItem('toctoc_week', weekTaps);

            updateStatsDisplay();

            // Tema colore dinamico ogni 100 tap
            if (totalTaps % 100 === 0) {
                document.body.style.backgroundColor = '#' + Math.floor(Math.random()*16777215).toString(16);
            }
        }

        function updateStatsDisplay() {
            document.getElementById('statsText').innerText = `Totali: ${totalTaps} | Oggi: ${todayTaps} | Settimana: ${weekTaps}`;
        }

        // Ascolta i tap in tempo reale dagli altri dispositivi
        db.ref('signal').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.timestamp > Date.now() - 3000) { // Esegue solo se ricevuto negli ultimi 3 secondi
                playSound(data.sound || 'porta');
                triggerAlert();
            }
        });

        function triggerAlert() {
            document.body.classList.add('alert-flash');
            setTimeout(() => {
                document.body.classList.remove('alert-flash');
            }, 1000);
        }

        // Configura il link di condivisione WhatsApp
        const shareText = encodeURIComponent("Scarica Toc-Toc e mandami un segnale in tempo reale! Ecco il link: " + window.location.href);
        document.getElementById('whatsappShare').href = `https://api.whatsapp.com/send?text=${shareText}`;
    </script>
</body>
</html>
