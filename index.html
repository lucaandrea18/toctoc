<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toc-Toc</title>
    <link rel="manifest" href="./manifest.json">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-color: #08080a;
            --text-color: #ffffff;
        }

        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        input {
            -webkit-user-select: auto;
            user-select: auto;
        }

        body {
            margin: 0;
            padding: 8px 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 98vh;
            box-sizing: border-box;
            overflow-x: hidden;
            transition: background-color 0.4s ease;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        h1 {
            font-size: 20px;
            margin: 0;
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        .user-box {
            width: 100%;
        }

        .main-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            outline: none;
            box-sizing: border-box;
        }

        .add-room-box {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        .add-btn {
            background: #2ed573;
            border: none;
            color: white;
            padding: 0 14px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            width: 100%;
            max-height: 120px;
            overflow-y: auto;
            padding: 2px 0;
        }

        .room-chip {
            background: rgba(255, 255, 255, 0.12);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            color: #ddd;
            padding: 5px 2px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .room-chip.active {
            background: #ff4757;
            border-color: #ff4757;
            color: #fff;
            box-shadow: 0 2px 8px rgba(255, 71, 87, 0.4);
        }

        .delete-room {
            font-size: 10px;
            color: #ff6b6b;
            margin-left: 2px;
        }

        .stats-container {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .stats-header-title {
            font-size: 10px;
            font-weight: bold;
            color: #ff4757;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            font-size: 11px;
        }

        .stat-box {
            text-align: center;
            color: #ccc;
        }

        .stat-box strong {
            color: #fff;
            font-size: 13px;
        }

        .type-breakdown {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 3px;
            font-size: 11px;
            font-weight: bold;
            color: #f1f2f6;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            width: 100%;
        }

        .sound-btn, .toggle-btn, .premium-btn, .reset-btn, .whatsapp-btn-side {
            flex: 1;
            background: rgba(255, 255, 255, 0.12);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            color: white;
            padding: 7px 2px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        .sound-btn.active, .toggle-btn.active {
            background: #ff4757;
            border-color: #ff4757;
        }

        .whatsapp-btn-side {
            background: #25D366;
            border-color: #25D366;
            color: #fff;
        }

        .premium-btn {
            background: linear-gradient(135deg, #f1c40f, #e67e22);
            border: none;
            color: #000;
        }

        .reset-btn {
            background: rgba(231, 76, 60, 0.3);
            border-color: #e74c3c;
            color: #ff6b6b;
        }

        .tap-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            margin: 4px 0;
        }

        .sender-alert {
            position: absolute;
            top: -15px;
            background: #ff4757;
            color: white;
            padding: 8px 15px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 10;
            text-align: center;
            line-height: 1.3;
        }

        .sender-alert.show {
            opacity: 1;
            transform: translateY(0);
        }

            width: 145px;
            height: 145px;
            border-radius: 50
