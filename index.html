<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toc-Toc</title>
    <link rel="manifest" href="./manifest.json">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-color: #08080a;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 10px 12px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 98vh;
            box-sizing: border-box;
            overflow-x: hidden;
            transition: background-color 0.4s ease;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        h1 {
            font-size: 22px;
            margin: 0;
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        /* Nome Utente */
        .user-box {
            width: 100%;
        }

        .main-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 9px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            outline: none;
            box-sizing: border-box;
        }

        /* Creazione Stanza */
        .add-room-box {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        .add-btn {
            background: #2ed573;
            border: none;
            color: white;
            padding: 0 16px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Griglia Stanze 4 per Riga */
        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            width: 100%;
            max-height: 140px;
            overflow-y: auto;
            padding: 2px 0;
        }

        .room-chip {
            background: rgba(255, 255, 255, 0.12);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            color: #ddd;
            padding: 6px 2px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .room-chip.active {
            background: #ff4757;
            border-color: #ff4757;
            color: #fff;
            box-shadow: 0 2px 8px rgba(255, 71, 87, 0.4);
        }

        .delete-room {
            font-size: 10px;
            color: #ff6b6b;
            margin-left: 2px;
        }

        /* Sezione Contatori */
        .stats-container {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            font-size: 11px;
        }

        .stat-box {
            text-align: center;
            color: #ccc;
        }

        .stat-box strong {
            color: #fff;
            font-size: 14px;
        }

        .type-breakdown {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 4px;
            font-size: 12px;
            font-weight: bold;
            color: #f1f2f6;
        }

        /* Controlli e Suoni */
        .controls-row {
            display: flex;
            justify-content: center;
            gap: 5px;
            width: 100%;
        }

        .sound-btn, .toggle-btn, .premium-btn, .reset-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.12);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            color: white;
            padding: 8px 2px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .sound-btn.active, .toggle-btn.active {
            background: #ff4757;
            border-color: #ff4757;
        }

        .premium-btn {
            background: linear-gradient(135deg, #f1c40f, #e67e22);
            border: none;
            color: #000;
        }

        .reset-btn {
            background: rgba(231, 76, 60, 0.3);
            border-color: #e74c3c;
            color: #ff6b6b;
        }

        /* Pulsante TOC-TOC centrale */
        .tap-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            margin: 6px 0;
        }

        .sender-alert {
            position: absolute;
            top: -15px;
            background: #ff4757;
            color: white;
            padding: 10px 18px;
            border-radius: 18px;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 10;
            text-align: center;
            line-height: 1.3;
        }

        .sender-alert.show {
            opacity: 1;
            transform: translateY(0);
        }

        .tap-button {
            width: 155px;
            height: 155px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            border: none;
            box-shadow: 0 10px 30px rgba(255, 71, 87, 0.5);
            color: white;
            font-size: 22px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
            outline: none;
            z-index: 2;
        }

        .tap-button:active {
            transform: scale(0.92);
        }

        .emoji-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .floating-emoji {
            position: absolute;
            font-size: 32px;
            animation: floatUp 2s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            100% { transform: translateY(-170px) scale(1.4); opacity: 0; }
        }

        .footer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .whatsapp-btn {
            background: #25D366;
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        .ad-banner {
            width: 100%;
            max-width: 320px;
            height: 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: #aaa;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>TOC-TOC 💗</h1>
        
        <div class="user-box">
            <input type="text" id="usernameInput" class="main-input" placeholder="Il tuo Nome" onchange="saveConfig()">
        </div>

        <!-- Aggiungi Nuova Stanza -->
        <div class="add-room-box">
            <input type="text" id="newRoomInput" class="main-input" placeholder="Crea Stanza (es. Famiglia)">
            <button class="add-btn" onclick="addNewRoom()">+</button>
        </div>

        <!-- Lista Stanze a Griglia (4 per Riga) -->
        <div class="rooms-grid" id="roomsList"></div>

        <div class="stats-container">
            <div class="stats-grid">
                <div class="stat-box">Oggi<br><strong id="statDay">0</strong></div>
                <div class="stat-box">Sett.<br><strong id="statWeek">0</strong></div>
                <div class="stat-box">Mese<br><strong id="statMonth">0</strong></div>
                <div class="stat-box">Anno<br><strong id="statYear">0</strong></div>
            </div>
            <div class="type-breakdown">
                <span>🚪 Porta: <span id="countPorta">0</span></span>
                <span>💓 Cuore: <span id="countCuore">0</span></span>
                <span>✨ Magia: <span id="countMagia">0</span></span>
            </div>
        </div>

        <div class="controls-row">
            <button class="sound-btn active" onclick="setSound('porta')">🚪 Porta</button>
            <button class="sound-btn" onclick="setSound('cuore')">💓 Cuore</button>
            <button class="sound-btn" onclick="setSound('magia')">✨ Magia</button>
        </div>

        <div class="controls-row">
            <button id="soundToggle" class="toggle-btn active" onclick="toggleSoundState()">🔊 Audio: ON</button>
            <button class="premium-btn" onclick="openPremium()">⭐ Premium</button>
            <button class="reset-btn" onclick="resetStats()">🗑️ Azzera</button>
        </div>
    </header>

    <div class="tap-container">
        <div id="senderAlert" class="sender-alert">TOC-TOC!</div>
        <div class="emoji-container" id="emojiBox"></div>
        <button class="tap-button" onclick="sendTap()">
            <span>TOC-TOC</span>
        </button>
    </div>

    <div class="footer">
        <div class="ad-banner">📢 Spazio Banner Pubblicitario</div>
        <a id="whatsappShare" class="whatsapp-btn" href="#" target="_blank">Invita su WhatsApp</a>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://toctoc-302c3-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentSound = 'porta';
        let soundEnabled = true;
        let currentRoomRef = null;

        let savedRooms = JSON.parse(localStorage.getItem('toctoc_rooms_list')) || ['generale', 'moglie', 'sorella', 'amico'];
        let activeRoom = localStorage.getItem('toctoc_room') || 'generale';
        let storedName = localStorage.getItem('toctoc_username') || '';

        document.getElementById('usernameInput').value = storedName;

        function saveConfig() {
            let nameVal = document.getElementById('usernameInput').value.trim();
            localStorage.setItem('toctoc_username', nameVal);
            updateWhatsappLink();
        }

        function renderRooms() {
            const list = document.getElementById('roomsList');
            list.innerHTML = '';
            
            savedRooms.forEach(room => {
                const chip = document.createElement('div');
                chip.className = `room-chip ${room === activeRoom ? 'active' : ''}`;
                chip.onclick = () => selectRoom(room);

                chip.innerHTML = `
                    <span>🏠 ${room}</span>
                    ${room !== 'generale' ? `<span class="delete-room" onclick="deleteRoom(event, '${room}')">✕</span>` : ''}
                `;
                list.appendChild(chip);
            });
            localStorage.setItem('toctoc_rooms_list', JSON.stringify(savedRooms));
        }

        function addNewRoom() {
            let input = document.getElementById('newRoomInput');
            let roomName = input.value.trim().toLowerCase();
            if (roomName && !savedRooms.includes(roomName)) {
                savedRooms.push(roomName);
                input.value = '';
                selectRoom(roomName);
            }
        }

        function deleteRoom(e, roomName) {
            e.stopPropagation();
            savedRooms = savedRooms.filter(r => r !== roomName);
            if (activeRoom === roomName) {
                selectRoom('generale');
            } else {
                renderRooms();
            }
        }

        function selectRoom(roomName) {
            activeRoom = roomName;
            localStorage.setItem('toctoc_room', activeRoom);
            renderRooms();
            updateRoomListener();
        }

        // Statistiche
        let stats = JSON.parse(localStorage.getItem('toctoc_stats')) || {
            day: 0, week: 0, month: 0, year: 0, total: 0,
            porta: 0, cuore: 0, magia: 0,
            lastDay: new Date().getDate()
        };

        checkDateReset();
        updateStatsDisplay();

        function checkDateReset() {
            let today = new Date().getDate();
            if (stats.lastDay !== today) {
                stats.day = 0;
                stats.lastDay = today;
                saveStats();
            }
        }

        function saveStats() {
            localStorage.setItem('toctoc_stats', JSON.stringify(stats));
        }

        function resetStats() {
            if(confirm("Vuoi azzerare tutte le statistiche?")) {
                stats = { day: 0, week: 0, month: 0, year: 0, total: 0, porta: 0, cuore: 0, magia: 0, lastDay: new Date().getDate() };
                saveStats();
                updateStatsDisplay();
            }
        }

        function setSound(type) {
            currentSound = type;
            document.querySelectorAll('.sound-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function toggleSoundState() {
            soundEnabled = !soundEnabled;
            let btn = document.getElementById('soundToggle');
            btn.innerText = soundEnabled ? "🔊 Audio: ON" : "🔇 Audio: OFF";
            btn.classList.toggle('active', soundEnabled);
        }

        function openPremium() {
            alert("Versione Premium Toc-Toc: Funzioni sbloccate e zero pubblicità!");
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled) return;
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }

            if (type === 'porta') {
                playTone(220, 0.08, 'triangle');
                setTimeout(() => playTone(260, 0.12, 'triangle'), 120);
            } else if (type === 'cuore') {
                playTone(120, 0.1, 'sine');
                setTimeout(() => playTone(100, 0.15, 'sine'), 180);
            } else if (type === 'magia') {
                playTone(400, 0.08, 'sine');
                setTimeout(() => playTone(600, 0.08, 'sine'), 80);
                setTimeout(() => playTone(880, 0.15, 'sine'), 160);
            }
        }

        function playTone(freq, duration, type) {
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function sendTap() {
            let senderName = document.getElementById('usernameInput').value.trim() || 'Qualcuno';

            playSound(currentSound);
            incrementStats(currentSound);

            let countForType = (stats[currentSound] || 1);

            db.ref('rooms/' + activeRoom).set({
                sound: currentSound,
                sender: senderName,
                count: countForType,
                timestamp: Date.now()
            });
        }

        function incrementStats(soundType) {
            stats.day++;
            stats.week++;
            stats.month++;
            stats.year++;
            stats.total++;

            if (soundType === 'porta') stats.porta = (stats.porta || 0) + 1;
            if (soundType === 'cuore') stats.cuore = (stats.cuore || 0) + 1;
            if (soundType === 'magia') stats.magia = (stats.magia || 0) + 1;

            saveStats();
            updateStatsDisplay();

            if (stats.total % 100 === 0) {
                triggerRainbowEffect();
                spawnThemeEmojis(soundType);
            }
        }

        function triggerRainbowEffect() {
            const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6', '#ff6b81'];
            let i = 0;
            let interval = setInterval(() => {
                document.body.style.backgroundColor = colors[i % colors.length];
                i++;
                if (i > 10) {
                    clearInterval(interval);
                    document.body.style.backgroundColor = '#08080a';
                }
            }, 300);
        }

        function spawnThemeEmojis(soundType) {
            const box = document.getElementById('emojiBox');
            let emojis = ['🎉', '🎊', '🌈', '🌟'];
            
            if (soundType === 'cuore') {
                emojis = ['❤️', '💖', '💗', '💓', '🎉', '🌈'];
            } else if (soundType === 'magia') {
                emojis = ['✨', '🪄', '🌟', '💫', '🎉', '🌈'];
            } else if (soundType === 'porta') {
                emojis = ['🚪', '🏡', '🔑', '🔔', '🎉', '🌈'];
            }

            for (let i = 0; i < 25; i++) {
                let span = document.createElement('span');
                span.className = 'floating-emoji';
                span.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                span.style.left = Math.random() * 80 + 10 + '%';
                span.style.bottom = '20px';
                span.style.animationDuration = (1.5 + Math.random()) + 's';
                box.appendChild(span);
                setTimeout(() => span.remove(), 2200);
            }
        }

        function updateStatsDisplay() {
            document.getElementById('statDay').innerText = stats.day;
            document.getElementById('statWeek').innerText = stats.week;
            document.getElementById('statMonth').innerText = stats.month;
            document.getElementById('statYear').innerText = stats.year;

            document.getElementById('countPorta').innerText = stats.porta || 0;
            document.getElementById('countCuore').innerText = stats.cuore || 0;
            document.getElementById('countMagia').innerText = stats.magia || 0;
        }

        function updateRoomListener() {
            saveConfig();

            if (currentRoomRef) {
                currentRoomRef.off();
            }

            currentRoomRef = db.ref('rooms/' + activeRoom);
            currentRoomRef.on('value', (snapshot) => {
                const data = snapshot.val();
                let myName = document.getElementById('usernameInput').value.trim() || 'Luca';
                
                if (data && data.timestamp > Date.now() - 3000 && data.sender !== myName) {
                    playSound(data.sound || 'porta');
                    
                    let alertBox = document.getElementById('senderAlert');
                    let name = data.sender || 'Qualcuno';
                    let icon = data.sound === 'cuore' ? '💓' : (data.sound === 'magia' ? '✨' : '🚪');
                    let countText = data.count ? `\n(${data.sound.toUpperCase()} #${data.count})` : '';

                    alertBox.innerText = `TOC-TOC da ${name}! ${icon}${countText}`;
                    alertBox.classList.add('show');
                    
                    setTimeout(() => {
                        alertBox.classList.remove('show');
                    }, 2800);
                }
            });
        }

        function updateWhatsappLink() {
            const shareText = encodeURIComponent(`Entra nella stanza "${activeRoom}" su Toc-Toc per scambiarci i segnali! Clicca qui: https://lucaandrea18.github.io/toctoc/`);
            document.getElementById('whatsappShare').href = `https://api.whatsapp.com/send?text=${shareText}`;
        }

        renderRooms();
        updateRoomListener();
    </script>
</body>
</html>
