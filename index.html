<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toc-Toc</title>
    <link rel="manifest" href="./manifest.json">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-color: #08080a;
            --text-color: #ffffff;
        }

        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }

        input {
            -webkit-user-select: auto;
            user-select: auto;
        }

        body {
            margin: 0;
            padding: 8px 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 98vh;
            overflow-x: hidden;
            transition: background-color 0.4s ease;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        h1 {
            font-size: 20px;
            margin: 0;
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        .user-box {
            width: 100%;
        }

        .main-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            outline: none;
        }

        .add-room-box {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        .add-btn {
            background: #2ed573;
            border: none;
            color: white;
            padding: 0 16px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            width: 100%;
            max-height: 120px;
            overflow-y: auto;
            padding: 2px 0;
        }

        .room-chip {
            background: rgba(255, 255, 255, 0.12);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            color: #ddd;
            padding: 6px 2px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .room-chip.active {
            background: #ff4757;
            border-color: #ff4757;
            color: #fff;
            box-shadow: 0 2px 8px rgba(255, 71, 87, 0.4);
        }

        .delete-room {
            font-size: 10px;
            color: #ff6b6b;
            margin-left: 2px;
        }

        .stats-container {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .stats-header-title {
            font-size: 10px;
            font-weight: bold;
            color: #ff4757;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            font-size: 11px;
        }

        .stat-box {
            text-align: center;
            color: #ccc;
        }

        .stat-box strong {
            color: #fff;
            font-size: 13px;
        }

        .type-breakdown {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 3px;
            font-size: 11px;
            font-weight: bold;
            color: #f1f2f6;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            width: 100%;
        }

        .sound-btn, .toggle-btn, .premium-btn, .reset-btn, .whatsapp-btn-side {
            flex: 1;
            background: rgba(255, 255, 255, 0.12);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            color: white;
            padding: 7px 2px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        .sound-btn.active, .toggle-btn.active {
            background: #ff4757;
            border-color: #ff4757;
        }

        .whatsapp-btn-side {
            background: #25D366;
            border-color: #25D366;
            color: #fff;
        }

        .premium-btn {
            background: linear-gradient(135deg, #f1c40f, #e67e22);
            border: none;
            color: #000;
        }

        .reset-btn {
            background: rgba(231, 76, 60, 0.3);
            border-color: #e74c3c;
            color: #ff6b6b;
        }

        .tap-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            margin: 4px 0;
        }

        .sender-alert {
            position: absolute;
            top: -15px;
            background: #ff4757;
            color: white;
            padding: 8px 15px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 10;
            text-align: center;
            line-height: 1.3;
        }

        .sender-alert.show {
            opacity: 1;
            transform: translateY(0);
        }

        .tap-button {
            width: 145px;
            height: 145px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            border: none;
            box-shadow: 0 8px 25px rgba(255, 71, 87, 0.5);
            color: white;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
            outline: none;
            z-index: 2;
            touch-action: manipulation;
        }

        .tap-button:active {
            transform: scale(0.92);
        }

        .tap-button.explode {
            animation: btnExplode 0.8s ease-out;
        }

        @keyframes btnExplode {
            0% { transform: scale(1); box-shadow: 0 0 20px #ff4757; }
            50% { transform: scale(1.35) rotate(5deg); box-shadow: 0 0 60px #2ed573, 0 0 90px #ff4757; }
            100% { transform: scale(1) rotate(0deg); box-shadow: 0 8px 25px rgba(255, 71, 87, 0.5); }
        }

        .emoji-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .floating-emoji {
            position: absolute;
            font-size: 30px;
            animation: floatUp 2s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            100% { transform: translateY(-150px) scale(1.4); opacity: 0; }
        }

        .special-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .special-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .special-icon-anim {
            font-size: 100px;
            animation: bounceAnim 1s infinite alternate ease-in-out;
            filter: drop-shadow(0 0 20px #2ed573);
        }

        @keyframes bounceAnim {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        .special-text {
            color: #fff;
            font-size: 24px;
            font-weight: 900;
            margin-top: 15px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255,255,255,0.6);
            letter-spacing: 2px;
        }

        .footer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .ad-banner {
            width: 100%;
            max-width: 320px;
            height: 38px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: #aaa;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>TOC-TOC 💗</h1>
        
        <div class="user-box">
            <input type="text" id="usernameInput" class="main-input" placeholder="Il tuo Nome">
        </div>

        <div class="add-room-box">
            <input type="text" id="newRoomInput" class="main-input" placeholder="Crea Stanza (es. Andrea)">
            <button id="addRoomBtn" class="add-btn">+</button>
        </div>

        <div class="rooms-grid" id="roomsList"></div>

        <div class="stats-container">
            <div class="stats-header-title" id="statsTitle">STATISTICHE STANZA: GENERALE</div>
            <div class="stats-grid">
                <div class="stat-box">Oggi<br><strong id="statDay">0</strong></div>
                <div class="stat-box">Sett.<br><strong id="statWeek">0</strong></div>
                <div class="stat-box">Mese<br><strong id="statMonth">0</strong></div>
                <div class="stat-box">Anno<br><strong id="statYear">0</strong></div>
            </div>
            <div class="type-breakdown">
                <span>🚪 Porta: <span id="countPorta">0</span></span>
                <span>💓 Cuore: <span id="countCuore">0</span></span>
                <span>✨ Magia: <span id="countMagia">0</span></span>
                <span>🌐 Tot App: <span id="countGlobalTotal">0</span></span>
            </div>
        </div>

        <div class="controls-row">
            <button class="sound-btn active" data-sound="porta">🚪 Porta</button>
            <button class="sound-btn" data-sound="cuore">💓 Cuore</button>
            <button class="sound-btn" data-sound="magia">✨ Magia</button>
        </div>

        <div class="controls-row">
            <button id="soundToggle" class="toggle-btn active">🔊 Audio</button>
            <button id="whatsappBtn" class="whatsapp-btn-side">💬 WhatsApp</button>
            <button id="premiumBtn" class="premium-btn">⭐ Premium</button>
            <button id="resetBtn" class="reset-btn">🗑️ Azzera</button>
        </div>
    </header>

    <div class="tap-container">
        <div id="senderAlert" class="sender-alert">TOC-TOC!</div>
        <div class="emoji-container" id="emojiBox"></div>
        <button class="tap-button" id="mainTapBtn">
            <span>TOC-TOC</span>
        </button>
    </div>

    <div id="specialOverlay" class="special-overlay">
        <div id="specialIcon" class="special-icon-anim">🆗</div>
        <div id="specialMessage" class="special-text">TRAGUARDO RAGGIUNTO!</div>
    </div>

    <div class="footer">
        <div class="ad-banner">📢 Spazio Banner Pubblicitario</div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://toctoc-302c3-default-rtdb.firebaseio.com/"
        };
        
        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch(e) { console.log(e); }

        let currentSound = 'porta';
        let soundEnabled = true;
        let currentRoomRef = null;
        let audioCtx = null;

        let savedRooms = JSON.parse(localStorage.getItem('toctoc_rooms_list')) || ['generale', 'moglie', 'sorella', 'andrea'];
        let activeRoom = localStorage.getItem('toctoc_room') || 'generale';
        let storedName = localStorage.getItem('toctoc_username') || '';

        document.getElementById('usernameInput').value = storedName;

        document.getElementById('usernameInput').addEventListener('input', function() {
            localStorage.setItem('toctoc_username', this.value.trim());
        });

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, duration, type) {
            try {
                if (!audioCtx) return;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudioContext();

            if (type === 'porta') {
                playTone(220, 0.08, 'triangle');
                setTimeout(() => playTone(260, 0.12, 'triangle'), 120);
            } else if (type === 'cuore') {
                playTone(120, 0.1, 'sine');
                setTimeout(() => playTone(100, 0.15, 'sine'), 180);
            } else if (type === 'magia') {
                playTone(400, 0.08, 'sine');
                setTimeout(() => playTone(600, 0.08, 'sine'), 80);
                setTimeout(() => playTone(880, 0.15, 'sine'), 160);
            }
        }

        function playApplaudShow(count) {
            if (!soundEnabled) return;
            initAudioContext();
            showSpecialOverlay('🆗👏', `GRANDE TRAGUARDO!\n${count} TOCCHI!`);
            const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
            notes.forEach((freq, idx) => {
                setTimeout(() => playTone(freq, 0.2, 'triangle'), idx * 120);
            });
            setTimeout(() => hideSpecialOverlay(), 4000);
        }

        function playMichaelJacksonShow() {
            if (!soundEnabled) return;
            initAudioContext();
            showSpecialOverlay('🕺', 'SPECIALE ANDREA: 200 TOCCHI!\nMICHAEL JACKSON');
            const baseNotes = [185.00, 277.18, 329.63, 369.99, 329.63, 277.18, 246.94, 277.18];
            const tempo = 180;
            for (let l = 0; l < 4; l++) {
                baseNotes.forEach((freq, index) => {
                    setTimeout(() => playTone(freq, 0.14, 'sawtooth'), (l * baseNotes.length * tempo) + (index * tempo));
                });
            }
            setTimeout(() => hideSpecialOverlay(), 7000);
        }

        function playWifeThanksShow() {
            if (!soundEnabled) return;
            showSpecialOverlay('💖', 'SPECIALE MOGLIE: 200 TOCCHI!\nGRAZIEEEEE!');
            if ('speechSynthesis' in window) {
                let utterance = new SpeechSynthesisUtterance('Grazieeeee mille amore mio!');
                utterance.lang = 'it-IT';
                utterance.rate = 0.9;
                utterance.pitch = 1.3;
                window.speechSynthesis.speak(utterance);
            }
            setTimeout(() => hideSpecialOverlay(), 5000);
        }

        function playKPopShow() {
            if (!soundEnabled) return;
            initAudioContext();
            showSpecialOverlay('🌟', 'SPECIALE SORELLA: 200 TOCCHI!\nK-POP VIBES');
            const kpopNotes = [523.25, 659.25, 783.99, 1046.50, 783.99, 659.25, 523.25, 587.33, 659.25, 523.25];
            const tempo = 150;
            for (let l = 0; l < 4; l++) {
                kpopNotes.forEach((freq, index) => {
                    setTimeout(() => playTone(freq, 0.1, 'sine'), (l * kpopNotes.length * tempo) + (index * tempo));
                });
            }
            setTimeout(() => hideSpecialOverlay(), 7000);
        }

        function showSpecialOverlay(icon, text) {
            document.getElementById('specialIcon').innerText = icon;
            document.getElementById('specialMessage').innerText = text;
            document.getElementById('specialOverlay').classList.add('show');
            triggerRainbowEffect();
        }

        function hideSpecialOverlay() {
            document.getElementById('specialOverlay').classList.remove('show');
        }

        function triggerButtonExplosion() {
            const btn = document.getElementById('mainTapBtn');
            btn.classList.add('explode');
            setTimeout(() => btn.classList.remove('explode'), 800);
        }

        function spawnConfetti() {
            const box = document.getElementById('emojiBox');
            const confettiList = ['🎉', '🎊', '✨', '🌟', '🌈', '🥳', '🎈', '🎆', '👏', '🆗'];
            for (let i = 0; i < 40; i++) {
                let span = document.createElement('span');
                span.className = 'floating-emoji';
                span.innerText = confettiList[Math.floor(Math.random() * confettiList.length)];
                span.style.left = Math.random() * 90 + 5 + '%';
                span.style.bottom = '10px';
                span.style.fontSize = (28 + Math.random() * 20) + 'px';
                span.style.animationDuration = (1.2 + Math.random() * 1.5) + 's';
                box.appendChild(span);
                setTimeout(() => span.remove(), 2500);
            }
        }

        function triggerRainbowEffect() {
            const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6', '#ff6b81'];
            let i = 0;
            let interval = setInterval(() => {
                document.body.style.backgroundColor = colors[i % colors.length];
                i++;
                if (i > 10) {
                    clearInterval(interval);
                    document.body.style.backgroundColor = '#08080a';
                }
            }, 300);
        }

        function getRoomStats() {
            let allStats = JSON.parse(localStorage.getItem('toctoc_room_stats')) || {};
            if (!allStats[activeRoom]) {
                allStats[activeRoom] = {
                    day: 0, week: 0, month: 0, year: 0, total: 0,
                    porta: 0, cuore: 0, magia: 0,
                    lastDay: new Date().getDate()
                };
            }
            return allStats;
        }

        function getGlobalTotal() {
            return parseInt(localStorage.getItem('toctoc_global_total')) || 0;
        }

        function setGlobalTotal(val) {
            localStorage.setItem('toctoc_global_total', val);
        }

        function updateStatsDisplay() {
            let allStats = getRoomStats();
            let stats = allStats[activeRoom];

            document.getElementById('statsTitle').innerText = `STATISTICHE STANZA: ${activeRoom.toUpperCase()}`;
            document.getElementById('statDay').innerText = stats.day;
            document.getElementById('statWeek').innerText = stats.week;
            document.getElementById('statMonth').innerText = stats.month;
            document.getElementById('statYear').innerText = stats.year;

            document.getElementById('countPorta').innerText = stats.porta || 0;
            document.getElementById('countCuore').innerText = stats.cuore || 0;
            document.getElementById('countMagia').innerText = stats.magia || 0;
            document.getElementById('countGlobalTotal').innerText = getGlobalTotal();
        }

        function renderRooms() {
            const list = document.getElementById('roomsList');
            list.innerHTML = '';
            
            savedRooms.forEach(room => {
                const chip = document.createElement('div');
                chip.className = `room-chip ${room === activeRoom ? 'active' : ''}`;
                
                let spanRoom = document.createElement('span');
                spanRoom.innerText = `🏠 ${room}`;
                spanRoom.onclick = () => selectRoom(room);
                chip.appendChild(spanRoom);

                if (room !== 'generale') {
                    let spanDel = document.createElement('span');
                    spanDel.className = 'delete-room';
                    spanDel.innerText = '✕';
                    spanDel.onclick = (e) => {
                        e.stopPropagation();
                        savedRooms = savedRooms.filter(r => r !== room);
                        if (activeRoom === room) selectRoom('generale');
                        else renderRooms();
                    };
                    chip.appendChild(spanDel);
                }
                list.appendChild(chip);
            });
            localStorage.setItem('toctoc_rooms_list', JSON.stringify(savedRooms));
        }

        function selectRoom(roomName) {
            activeRoom = roomName;
            localStorage.setItem('toctoc_room', activeRoom);
            renderRooms();
            updateRoomListener();
            updateStatsDisplay();
        }

        function updateRoomListener() {
            if (!db) return;
            if (currentRoomRef) currentRoomRef.off();

            currentRoomRef = db.ref('rooms/' + activeRoom);
            currentRoomRef.on('value', (snapshot) => {
                const data = snapshot.val();
                let myName = document.getElementById('usernameInput').value.trim() || 'Luca';
                
                if (data && data.timestamp > Date.now() - 3000 && data.sender !== myName) {
                    playSound(data.sound || 'porta');
                    
                    let alertBox = document.getElementById('senderAlert');
                    let name = data.sender || 'Qualcuno';
                    let icon = data.sound === 'cuore' ? '💓' : (data.sound === 'magia' ? '✨' : '🚪');
                    let countText = data.count ? `\n(${data.sound.toUpperCase()} #${data.count})` : '';

                    alertBox.innerText = `TOC-TOC da ${name}! ${icon}${countText}`;
                    alertBox.classList.add('show');
                    
                    setTimeout(() => alertBox.classList.remove('show'), 2800);
                }
            });
        }

        // Assegnazione sicura di tutti gli eventi tramite JavaScript
        document.addEventListener('DOMContentLoaded', () => {
            renderRooms();
            updateRoomListener();
            updateStatsDisplay();

            // Tasto Aggiungi Stanza (+)
            document.getElementById('addRoomBtn').addEventListener('click', () => {
                let input = document.getElementById('newRoomInput');
                let roomName = input.value.trim().toLowerCase();
                if (roomName && !savedRooms.includes(roomName)) {
                    savedRooms.push(roomName);
                    input.value = '';
                    selectRoom(roomName);
                }
            });

            // Selezione Suoni (Porta, Cuore, Magia)
            document.querySelectorAll('.sound-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    currentSound = e.target.getAttribute('data-sound');
                    document.querySelectorAll('.sound-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                });
            });

            // Toggle Audio ON/OFF
            document.getElementById('soundToggle').addEventListener('click', (e) => {
                soundEnabled = !soundEnabled;
                e.target.innerText = soundEnabled ? "🔊 Audio" : "🔇 Audio";
                e.target.classList.toggle('active', soundEnabled);
            });

            // Tasto WhatsApp
            document.getElementById('whatsappBtn').addEventListener('click', () => {
                const shareText = `Entra nella stanza "${activeRoom}" su Toc-Toc per scambiarci i segnali! Clicca qui: https://lucaandrea18.github.io/toctoc/`;
                if (navigator.share) {
                    navigator.share({ title: 'Toc-Toc', text: shareText }).catch(() => {
                        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`, '_blank');
                    });
                } else {
                    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`, '_blank');
                }
            });

            // Tasto Premium
            document.getElementById('premiumBtn').addEventListener('click', () => {
                alert("Versione Premium Toc-Toc: Funzioni sbloccate e zero pubblicità!");
            });

            // Tasto Azzera Statistiche
            document.getElementById('resetBtn').addEventListener('click', () => {
                if(confirm(`Vuoi azzerare le statistiche della stanza "${activeRoom}"?`)) {
                    let allStats = getRoomStats();
                    allStats[activeRoom] = { day: 0, week: 0, month: 0, year: 0, total: 0, porta: 0, cuore: 0, magia: 0, lastDay: new Date().getDate() };
                    localStorage.setItem('toctoc_room_stats', JSON.stringify(allStats));
                    updateStatsDisplay();
                }
            });

            // Tasto Centrale TOC-TOC
            document.getElementById('mainTapBtn').addEventListener('click', () => {
                initAudioContext();
                let senderName = document.getElementById('usernameInput').value.trim() || 'Qualcuno';

                playSound(currentSound);

                let allStats = getRoomStats();
                let stats = allStats[activeRoom];

                let today = new Date().getDate();
                if (stats.lastDay !== today) {
                    stats.day = 0;
                    stats.lastDay = today;
                }

                stats.day++;
                stats.week++;
                stats.month++;
                stats.year++;
                stats.total++;

                setGlobalTotal(getGlobalTotal() + 1);

                if (currentSound === 'porta') stats.porta = (stats.porta || 0) + 1;
                if (currentSound === 'cuore') stats.cuore = (stats.cuore || 0) + 1;
                if (currentSound === 'magia') stats.magia = (stats.magia || 0) + 1;

                let countForType = stats[currentSound];
                localStorage.setItem('toctoc_room_stats', JSON.stringify(allStats));
                updateStatsDisplay();

                if (stats.total % 100 === 0) {
                    triggerButtonExplosion();
                    spawnConfetti();
                    triggerRainbowEffect();

                    if (stats.total % 200 === 0) {
                        if (activeRoom === 'andrea' || activeRoom === 'figlio') {
                            playMichaelJacksonShow();
                        } else if (activeRoom === 'moglie') {
                            playWifeThanksShow();
                        } else if (activeRoom === 'sorella') {
                            playKPopShow();
                        } else {
                            playApplaudShow(stats.total);
                        }
                    } else {
                        playApplaudShow(stats.total);
                    }
                }

                if (db) {
                    db.ref('rooms/' + activeRoom).set({
                        sound: currentSound,
                        sender: senderName,
                        count: countForType,
                        timestamp: Date.now()
                    });
                }
            });
        });
    </script>
</body>
</html>
