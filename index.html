<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toc-Toc</title>
    
    <style>
        :root {
            --bg-color: #08080a;
            --text-color: #ffffff;
            --accent-color: #ff4757;
            --accent-glow: rgba(255, 71, 87, 0.5);
        }

        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }

        input {
            -webkit-user-select: auto;
            user-select: auto;
        }

        body {
            margin: 0;
            padding: 8px 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 98vh;
            overflow-x: hidden;
            transition: background-color 0.4s ease;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        h1 {
            font-size: 20px;
            margin: 0;
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        .user-box {
            width: 100%;
        }

        .main-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            outline: none;
        }

        .add-room-box {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        .add-btn {
            background: #2ed573;
            border: none;
            color: white;
            padding: 0 16px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            width: 100%;
            max-height: 120px;
            overflow-y: auto;
            padding: 2px 0;
        }

        .room-chip {
            background: rgba(255, 255, 255, 0.12);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            color: #ddd;
            padding: 6px 2px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .room-chip.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        .delete-room {
            font-size: 10px;
            color: #ff6b6b;
            margin-left: 2px;
        }

        .stats-container {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .stats-header-title {
            font-size: 10px;
            font-weight: bold;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            font-size: 11px;
        }

        .stat-box {
            text-align: center;
            color: #ccc;
        }

        .stat-box strong {
            color: #fff;
            font-size: 13px;
        }

        .type-breakdown {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 3px;
            font-size: 11px;
            font-weight: bold;
            color: #f1f2f6;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            width: 100%;
        }

        .quick-msg-row {
            display: flex;
            gap: 4px;
            width: 100%;
            overflow-x: auto;
            padding: 2px 0;
        }

        .quick-msg-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ccc;
            padding: 5px 8px;
            border-radius: 8px;
            font-size: 10px;
            white-space: nowrap;
            cursor: pointer;
        }

        .quick-msg-btn.selected {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .sound-btn, .toggle-btn, .premium-btn, .reset-btn, .whatsapp-btn-side {
            flex: 1;
            background: rgba(255, 255, 255, 0.12);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            color: white;
            padding: 7px 2px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        .sound-btn.active, .toggle-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        .whatsapp-btn-side {
            background: #25D366;
            border-color: #25D366;
            color: #fff;
        }

        .premium-btn {
            background: linear-gradient(135deg, #f1c40f, #e67e22);
            border: none;
            color: #000;
        }

            background: rgba(231, 76, 60, 0.3);
            border-color
