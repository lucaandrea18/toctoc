<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toc-Toc</title>
    <link rel="manifest" href="./manifest.json">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-color: #08080a;
            --text-color: #ffffff;
        }

        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }

        input {
            -webkit-user-select: auto;
            user-select: auto;
        }

        body {
            margin: 0;
            padding: 8px 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 98vh;
            overflow-x: hidden;
            transition: background-color 0.4s ease;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        h1 {
            font-size: 20px;
            margin: 0;
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        .user-box {
            width: 100%;
        }

        .main-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            outline: none;
        }

        .add-room-box {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        .add-btn {
            background: #2ed573;
            border: none;
            color: white;
            padding: 0 14px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            width: 100%;
            max-height: 120px;
            overflow-y: auto;
            padding: 2px 0;
        }

        .room-chip {
            background: rgba(255, 255, 255, 0.12);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            color: #ddd;
            padding: 5px 2px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .room-chip.active {
            background: #ff4757;
            border-color: #ff4757;
            color: #fff;
            box-shadow: 0 2px 8px rgba(255, 71, 87, 0.4);
        }

        .delete-room {
            font-size: 10px;
            color: #ff6b6b;
            margin-left: 2px;
        }

        .stats-container {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .stats-header-title {
            font-size: 10px;
            font-weight: bold;
            color: #ff4757;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            font-size: 11px;
        }

        .stat-box {
            text-align: center;
            color: #ccc;
        }

        .stat-box strong {
            color: #fff;
            font-size: 13px;
        }

        .type-breakdown {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 3px;
            font-size: 11px;
            font-weight: bold;
            color: #f1f2f6;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            width: 100%;
        }

        .sound-btn, .toggle-btn, .premium-btn, .reset-btn, .whatsapp-btn-side {
            flex: 1;
            background: rgba(255, 255, 255, 0.12);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            color: white;
            padding: 7px 2px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        .sound-btn.active, .toggle-btn.active {
            background: #ff4757;
            border-color: #ff4757;
        }

        .whatsapp-btn-side {
            background: #25D366;
            border-color: #25D366;
            color: #fff;
        }

        .premium-btn {
            background: linear-gradient(135deg, #f1c40f, #e67e22);
            border: none;
            color: #000;
        }

        .reset-btn {
            background: rgba(231, 76, 60, 0.3);
            border-color: #e74c3c;
            color: #ff6b6b;
        }

        .tap-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            margin: 4px 0;
        }

        .sender-alert {
            position: absolute;
            top: -15px;
            background: #ff4757;
            color: white;
            padding: 8px 15px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 10;
            text-align: center;
            line-height: 1.3;
        }

        .sender-alert.show {
            opacity: 1;
            transform: translateY(0);
        }

        .tap-button {
            width: 145px;
            height: 145px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            border: none;
            box-shadow: 0 8px 25px rgba(255, 71, 87, 0.5);
            color: white;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
            outline: none;
            z-index: 2;
            touch-action: manipulation;
        }

        .tap-button:active {
            transform: scale(0.92);
        }

        .tap-button.explode {
            animation: btnExplode 0.8s ease-out;
        }

        @keyframes btnExplode {
            0% { transform: scale(1); box-shadow: 0 0 20px #ff4757; }
            50% { transform: scale(1.35) rotate(5deg); box-shadow: 0 0 60px #2ed573, 0 0 90px #ff4757; }
            100% { transform: scale(1) rotate(0deg); box-shadow: 0 8px 25px rgba(255, 71, 87, 0.5); }
        }

        .emoji-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .floating-emoji {
            position: absolute;
            font-size: 30px;
            animation: floatUp 2s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            100% { transform: translateY(-150px) scale(1.4); opacity: 0; }
        }

        .special-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .special-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .special-icon-anim {
            font-size: 100px;
            animation: bounceAnim 1s infinite alternate ease-in-out;
            filter: drop-shadow(0 0 20px #2ed573);
        }

        @keyframes bounceAnim {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        .special-text {
            color: #fff;
            font-size: 24px;
            font-weight: 900;
            margin-top: 15px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255,255,255,0.6);
            letter-spacing: 2px;
        }

        .footer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .ad-banner {
            width: 100%;
            max-width: 320px;
            height: 38px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: #aaa;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>TOC-TOC 💗</h1>
        
        <div class="user-box">
            <input type="text" id="usernameInput" class="main-input" placeholder="Il tuo Nome" oninput="saveConfig()">
        </div>

        <div class="add-room-box">
            <input type="text" id="newRoomInput" class="main-input" placeholder="Crea Stanza (es. Andrea)">
            <button class="add-btn" onclick="addNewRoom()">+</button>
        </div>

        <div class="rooms-grid" id="roomsList"></div>

        <div class="stats-container">
            <div class="stats-header-title" id="statsTitle">STATISTICHE STANZA: GENERALE</div>
            <div class="stats-grid">
                <div class="stat-box">Oggi<br><strong id="statDay">0</strong></div>
                <div class="stat-box">Sett.<br><strong id="statWeek">0</strong></div>
                <div class="stat-box">Mese<br><strong id="statMonth">0</strong></div>
                <div class="stat-box">Anno<br><strong id="statYear">0</strong></div>
            </div>
            <div class="type-breakdown">
                <span>🚪 Porta: <span id="countPorta">0</span></span>
                <span>💓 Cuore: <span id="countCuore">0</span></span>
                <span>✨ Magia: <span id="countMagia">0</span></span>
                <span>🌐 Tot App: <span id="countGlobalTotal">0</span></span>
            </div>
        </div>

        <div class="controls-row">
            <button class="sound-btn active" onclick="setSound(event, 'porta')">🚪 Porta</button>
            <button class="sound-btn" onclick="setSound(event, 'cuore')">💓 Cuore</button>
            <button class="sound-btn" onclick="setSound(event, 'magia')">✨ Magia</button>
        </div>

        <div class="controls-row">
            <button id="soundToggle" class="toggle-btn active" onclick="toggleSoundState()">🔊 Audio</button>
            <a id="whatsappShareBtn" class="whatsapp-btn-side" href="#" onclick="shareOnWhatsApp(event)">💬 WhatsApp</a>
            <button class="premium-btn" onclick="openPremium()">⭐ Premium</button>
            <button class="reset-btn" onclick="resetStats()">🗑️ Azzera</button>
        </div>
    </header>

    <div class="tap-container">
        <div id="senderAlert" class="sender-alert">TOC-TOC!</div>
        <div class="emoji-container" id="emojiBox"></div>
        <button class="tap-button" id="mainTapBtn" onclick="sendTap()" oncontextmenu="return false;">
            <span>TOC-TOC</span>
        </button>
    </div>

    <div id="specialOverlay" class="special-overlay">
        <div id="specialIcon" class="special-icon-anim">🆗</div>
        <div id="specialMessage" class="special-text">TRAGUARDO RAGGIUNTO!</div>
    </div>

    <div class="footer">
        <div class="ad-banner">📢 Spazio Banner Pubblicitario</div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://toctoc-302c3-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentSound = 'porta';
        let soundEnabled = true;
        let currentRoomRef = null;
        let audioCtx = null;

        let savedRooms = JSON.parse(localStorage.getItem('toctoc_rooms_list')) || ['generale', 'moglie', 'sorella', 'andrea'];
        let activeRoom = localStorage.getItem('toctoc_room') || 'generale';
        let storedName = localStorage.getItem('toctoc_username') || '';

        document.getElementById('usernameInput').value = storedName;

        function saveConfig() {
            let nameVal = document.getElementById('usernameInput').value.trim();
            localStorage.setItem('toctoc_username', nameVal);
        }

        function renderRooms() {
            const list = document.getElementById('roomsList');
            list.innerHTML = '';
            
            savedRooms.forEach(room => {
                const chip = document.createElement('div');
                chip.className = `room-chip ${room === activeRoom ? 'active' : ''}`;
                chip.onclick = () => selectRoom(room);

                chip.innerHTML = `
                    <span>🏠 ${room}</span>
                    ${room !== 'generale' ? `<span class="delete-room" onclick="deleteRoom(event, '${room}')">✕</span>` : ''}
                `;
                list.appendChild(chip);
            });
            localStorage.setItem('toctoc_rooms_list', JSON.stringify(savedRooms));
        }

        function addNewRoom() {
            let input = document.getElementById('newRoomInput');
            let roomName = input.value.trim().toLowerCase();
            if (roomName && !savedRooms.includes(roomName)) {
                savedRooms.push(roomName);
                input.value = '';
                selectRoom(roomName);
            }
        }

        function deleteRoom(e, roomName) {
            e.stopPropagation();
            savedRooms = savedRooms.filter(r => r !== roomName);
            if (activeRoom === roomName) {
                selectRoom('generale');
            } else {
                renderRooms();
            }
        }

        function selectRoom(roomName) {
            activeRoom = roomName;
            localStorage.setItem('toctoc_room', activeRoom);
            renderRooms();
            updateRoomListener();
            updateStatsDisplay();
        }

        function getRoomStats() {
            let allStats = JSON.parse(localStorage.getItem('toctoc_room_stats')) || {};
            if (!allStats[activeRoom]) {
                allStats[activeRoom] = {
                    day: 0, week: 0, month: 0, year: 0, total: 0,
                    porta: 0, cuore: 0, magia: 0,
                    lastDay: new Date().getDate()
                };
            }
            return allStats;
        }

        function getGlobalTotal() {
            return parseInt(localStorage.getItem('toctoc_global_total')) || 0;
        }

        function setGlobalTotal(val) {
            localStorage.setItem('toctoc_global_total', val);
        }

        function saveRoomStats(allStats) {
            localStorage.setItem('toctoc_room_stats', JSON.stringify(allStats));
        }

        function checkDateReset(roomStats) {
            let today = new Date().getDate();
            if (roomStats.lastDay !== today) {
                roomStats.day = 0;
                roomStats.lastDay = today;
            }
        }

        function resetStats() {
            if(confirm(`Vuoi azzerare le statistiche della stanza "${activeRoom}"?`)) {
                let allStats = getRoomStats();
                allStats[activeRoom] = { day: 0, week: 0, month: 0, year: 0, total: 0, porta: 0, cuore: 0, magia: 0, lastDay: new Date().getDate() };
                saveRoomStats(allStats);
                updateStatsDisplay();
            }
        }

        function setSound(e, type) {
            currentSound = type;
            document.querySelectorAll('.sound-btn').forEach(b => b.classList.remove('active'));
            if (e && e.target) {
                e.target.classList.add('active');
            }
        }

        function toggleSoundState() {
            soundEnabled = !soundEnabled;
            let btn = document.getElementById('soundToggle');
            btn.innerText = soundEnabled ? "🔊 Audio" : "🔇 Audio";
            btn.
